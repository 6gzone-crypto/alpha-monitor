name: Alpha123 Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run test
        env:
          XTUIS_TOKEN: ${{ secrets.XTUIS_TOKEN }}
        run: python test.py
